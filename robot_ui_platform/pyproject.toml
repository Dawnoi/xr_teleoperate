[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-ui-platform"
version = "0.1.0"
description = "Robot-agnostic UI control-plane primitives"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["robot_ui_platform"]

[tool.setuptools.package-data]
robot_ui_platform = ["web/*", "web/assets/*"]
